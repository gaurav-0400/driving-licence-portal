<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Driving Licence Portal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef3f9;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            color: #1e293b;
        }

        .sidebar {
            background: linear-gradient(180deg, #0b2447 0%, #133c78 60%, #0b2447 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar .nav-link-item {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 8px;
            margin-bottom: 4px;
            font-weight: 500;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .sidebar .nav-link-item:hover,
        .sidebar .nav-link-item.active {
            background: #1d63dc;
            color: #ffffff;
        }

        .sidebar-logout-btn {
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
        }

        .stat-card-blue { background: #eff6ff; border-color: #dbeafe; }
        .stat-card-green { background: #ecfdf5; border-color: #d1fae5; }
        .stat-card-amber { background: #fff7ed; border-color: #ffedd5; }
        .stat-card-purple { background: #f5f3ff; border-color: #ede9fe; }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            color: #ffffff;
            flex-shrink: 0;
        }

        .stat-number {
            font-size: 1.65rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-paid { background: #dcfce7; color: #166534; }
        .status-verified { background: #dbeafe; color: #1e40af; }
        .status-pending { background: #ffedd5; color: #9a3412; }

        .portal-banner {
            background: linear-gradient(135deg, #0b2447 0%, #1d4ed8 65%, #38bdf8 100%);
            color: #ffffff;
            border-radius: 14px 14px 0 0;
        }

        .avatar-preview {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            flex-shrink: 0;
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>

<body>
    {% block body %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>

</html>
