{% extends 'base.html' %}

{% block title %}Admin Login - Driving Licence Portal{% endblock %}

{% block body %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card overflow-hidden">
                <div class="portal-banner p-4 text-center">
                    <div class="fs-1 mb-1"><i class="bi bi-car-front-fill"></i></div>
                    <h4 class="fw-bold mb-0">Driving Licence Portal</h4>
                    <small class="text-white-50">Admin Panel Login</small>
                </div>
                <div class="p-4">
                    {% if form.errors %}
                        <div class="alert alert-danger">
                            Invalid username or password.
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
